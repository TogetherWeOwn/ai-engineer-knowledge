# The highest changed-path tier wins, including both sides of renames;
# sensitive wins overlaps and unmatched paths default to sensitive.
# Content triggers escalate regardless of path: endpoints or input parsing;
# auth, sessions, crypto, keys, secrets, credentials or permissions;
# tenant or personal data; SQL, schema or migrations; dependencies or
# lockfiles (including dev dependencies); CI or workflows; weakened or
# deleted assertions or tests, or lower gates. These are review policy,
# not a claim that this file installs or enforces an automated guard.
# No low paths are currently allowlisted: README.md includes operational
# and credential guidance. Ordinary remains empty pending a module audit.
version: 1
default_tier: sensitive
tiers:
  low: []
  ordinary: []
  sensitive:
    - .github/**
    - scripts/**
    - tests/**
