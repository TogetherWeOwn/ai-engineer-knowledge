name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest pyyaml
      - name: Run tests
        run: pytest -q
      - name: Generated tree is up to date
        run: python3 scripts/generate_claims.py --check
