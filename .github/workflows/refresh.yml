name: refresh

# Publication is explicitly paused while the frozen-catalog/OKF migration is
# corrected. Keep discovery only: never regenerate over the source catalog or
# stage private captions. Caption ingestion will be separately canary-gated.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: List RSS discovery only (legacy caption-file check)
        run: python3 scripts/check_rss.py
      - name: Explain publication hold
        run: |
          echo "Discovery only. Corrected generator, private-caption canary and real-corpus acceptance are pending."
