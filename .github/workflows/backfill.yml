name: backfill

# Live C6 publish-date backfill: YouTube videos.list -> analysis/*.json
# published_at, using the repo-scoped YOUTUBE_API_KEY. Manual dispatch only.
# Single writer (concurrency group); stages analysis/*.json explicitly, never
# anything else. Exit 1 (incomplete coverage) still commits partial progress
# so the next dispatch continues; exit 2 (error) commits nothing new because
# the script validates before writing.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill-publish-dates
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run publish-date backfill
        id: backfill
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set +e
          python3 scripts/backfill_publish_dates.py | tee /tmp/backfill-report.json
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Commit analysis dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/*.json
          if git diff --cached --quiet; then
            echo "No date changes to commit."
          else
            git commit -m "data: backfill video publish dates (videos.list)"
            git push
          fi
      - name: Report gate result
        run: |
          cat /tmp/backfill-report.json
          code='${{ steps.backfill.outputs.exit_code }}'
          case "$code" in
            0|1|2) exit "$code" ;;
            *) echo "unexpected backfill exit code: $code"; exit 2 ;;
          esac
